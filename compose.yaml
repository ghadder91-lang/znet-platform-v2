services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/znet.sqlite
      BACKUP_DIR: /app/backups
      SANDBOX_DATABASE_PATH: /app/data/sandbox.sqlite
    volumes:
      - znet_data:/app/data
      - znet_backups:/app/backups
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
  delivery-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/znet.sqlite
      SANDBOX_DATABASE_PATH: /app/data/sandbox.sqlite
    volumes:
      - znet_data:/app/data
    command: ["node", "scripts/delivery-worker.mjs"]
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  forecast-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/znet.sqlite
    volumes:
      - znet_data:/app/data
    command: ["node", "scripts/forecast-worker.mjs"]
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  znet_data:
  znet_backups:
  caddy_data:
  caddy_config:

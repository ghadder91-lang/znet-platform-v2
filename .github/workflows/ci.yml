name: Z NET CI

on:
  push:
    branches:
      - main
      - codex/znet-production-readiness
  pull_request:

permissions:
  contents: read

concurrency:
  group: znet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: pnpm test
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
